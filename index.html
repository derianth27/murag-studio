<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131417" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MURAG">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>MURAG Studio</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="app.css">
</head>
<body>
<a class="skip" href="#main">Lewati ke isi</a>

<!-- Bilah atas (HP) -->
<header class="topbar" id="topbar">
  <button class="icon-btn" id="menuToggle" aria-label="Buka menu" aria-controls="sidebar" aria-expanded="false" data-ico="menu"></button>
  <div class="topbar-title" id="topTitle">MURAG</div>
  <span class="save-dot" id="saveDot" role="status" aria-label="Status simpan"></span>
  <a class="icon-btn" href="#/cari" aria-label="Cari" data-ico="search"></a>
</header>

<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="Navigasi">
    <div class="sidebar-top">
      <a class="brand" href="#/beranda">
        <span class="brand-mark" aria-hidden="true">M</span>
        <span class="brand-text"><b>MURAG</b><small>Studio Penulisan</small></span>
      </a>
      <button class="icon-btn only-mobile" id="menuClose" aria-label="Tutup menu" data-ico="x"></button>
    </div>
    <div class="search-box">
      <input id="globalSearch" type="search" placeholder="Cari apa saja…  ( / )" autocomplete="off" aria-label="Cari">
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <button class="btn ghost small" id="btnPhone" title="Buka aplikasi ini dari HP"><span data-ico="phone"></span>Buka di HP</button>
      <button class="btn ghost small" id="btnBackup" title="Unduh seluruh data sebagai file JSON"><span data-ico="download"></span>Cadangan</button>
      <button class="btn ghost small" id="btnTheme" title="Ganti tema terang/gelap"><span data-ico="theme"></span>Tema</button>
    </div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>
  <main class="main" id="main" tabindex="-1">
    <div class="loading">Memuat ingatan cerita…</div>
  </main>
</div>

<!-- Navigasi bawah (HP) -->
<nav class="bottomnav" id="bottomnav" aria-label="Navigasi utama"></nav>

<button class="exit-focus" id="exitFocus" aria-label="Keluar mode fokus"><span data-ico="x"></span>Keluar fokus</button>
<div class="savebar" id="saveStatus" role="status">—</div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
